<section class="hero-section">
  <div class="hero-content">
    <div class="badge">{{ 'HOME.BADGE' | translate }}</div>
    
    <h1 class="hero-title">
      {{ 'HOME.GREETING' | translate }} <span class="text-primary">{{ 'HOME.NAME' | translate }}</span>
    </h1>
    
    <p class="hero-description">
      {{ 'HOME.DESCRIPTION' | translate }}
    </p>

    <div class="hero-buttons">
        <a routerLink="/portfolio" class="btn btn-primary" data-aos="fade-up" data-aos-delay="200">
          {{ 'HOME.VIEW_PROJECTS' | translate }}
          <svg lucideArrowUpRight class="icon-sm"></svg>
        </a>
        <a [href]="cvUrl" download="CV_Mounguengui_Ibinga.pdf" target="_blank" class="btn btn-outline" data-aos="fade-up" data-aos-delay="300">
          {{ 'HOME.DOWNLOAD_CV' | translate }}
          <svg lucideDownload class="icon-sm"></svg>
        </a>
      </div>

    <div class="hero-technologies">
      <span class="tech-title">{{ 'HOME.TECH_TITLE' | translate }}</span>
      <div class="tech-icons">
        <!-- First set -->
        <i class="devicon-html5-plain colored"></i>
        <i class="devicon-css3-plain colored"></i>
        <i class="devicon-javascript-plain colored"></i>
        <i class="devicon-angularjs-plain colored"></i>
        <i class="devicon-flutter-plain colored"></i>
        <i class="devicon-laravel-original colored"></i>
        <i class="devicon-symfony-original colored"></i>
        <i class="devicon-mysql-plain colored"></i>
        <i class="devicon-postgresql-plain colored"></i>
        <i class="devicon-firebase-plain colored"></i>
        <i class="devicon-supabase-plain colored"></i>
        <!-- Duplicated set for infinite scroll -->
        <i class="devicon-html5-plain colored"></i>
        <i class="devicon-css3-plain colored"></i>
        <i class="devicon-javascript-plain colored"></i>
        <i class="devicon-angularjs-plain colored"></i>
        <i class="devicon-flutter-plain colored"></i>
        <i class="devicon-laravel-original colored"></i>
        <i class="devicon-symfony-original colored"></i>
        <i class="devicon-mysql-plain colored"></i>
        <i class="devicon-postgresql-plain colored"></i>
        <i class="devicon-firebase-plain colored"></i>
        <i class="devicon-supabase-plain colored"></i>
      </div>
    </div>
  </div>

  <div class="hero-visuals">
    <div class="circle-backdrop"></div>
    <img src="/assets/profile.jpg" alt="Barry MOUNGUENGUI IBINGA" class="profile-image" />
  </div>
</section>
