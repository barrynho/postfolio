<section class="portfolio-section" id="portfolio">
  <div class="portfolio-header">
    <span class="badge">{{ 'PORTFOLIO.BADGE' | translate }}</span>
    <h2>{{ 'PORTFOLIO.TITLE' | translate }}</h2>
  </div>

  <div class="projects-grid-circular" *ngIf="!isLoading">
    @for (project of projects; track project.id) {
      <div class="project-circle-card" data-aos="fade-up">
        <div class="project-circle-image">
          <img [src]="project.image" [alt]="project.title" />
          <div class="project-overlay">
            <h3>{{project.title}}</h3>
            <p>{{project.description.substring(0, 80)}}{{project.description.length > 80 ? '...' : ''}}</p>
            <a [href]="project.demoUrl" class="project-link" target="_blank" [title]="'PORTFOLIO.VIEW_PROJECT' | translate">
              <svg lucideArrowRight class="icon-sm"></svg>
            </a>
          </div>
        </div>
      </div>
    }
  </div>

  <div class="loading-state" *ngIf="isLoading" style="text-align: center; padding: 4rem;">
    <div class="loader" style="border: 3px solid rgba(139, 92, 246, 0.3); border-bottom-color: #8b5cf6; border-radius: 50%; width: 40px; height: 40px; display: inline-block; animation: rotation 1s linear infinite;"></div>
    <p style="margin-top: 1rem; color: rgba(255,255,255,0.7);">{{ 'PORTFOLIO.LOADING' | translate }}</p>
  </div>
</section>
